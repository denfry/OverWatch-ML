name: CI / Auto Release

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Build — runs on every push and PR
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      jar:     ${{ steps.version.outputs.jar }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Read version from pom.xml
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION"          >> $GITHUB_OUTPUT
          echo "jar=OverWatch-ML-${VERSION}.jar" >> $GITHUB_OUTPUT

      - name: Build (skip tests)
        run: mvn clean package -DskipTests

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OverWatch-ML-${{ steps.version.outputs.version }}
          path: target/${{ steps.version.outputs.jar }}
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Release — only on push to main
  #   - Skips silently if tag v<version> already exists (idempotent)
  #   - Creates GitHub Release + publishes to Modrinth
  # ─────────────────────────────────────────────────────────────
  release:
    name: Release (main)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: OverWatch-ML-${{ needs.build.outputs.version }}
          path: target/

      - name: Check if release tag already exists
        id: tag_check
        run: |
          TAG="v${{ needs.build.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::notice::Tag $TAG already exists — skipping release."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: OverWatch-ML v${{ needs.build.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: target/${{ needs.build.outputs.jar }}

      - name: Publish to Modrinth
        if: steps.tag_check.outputs.exists == 'false'
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_API_TOKEN }}
          project: TT5IPxXT
          version: ${{ needs.build.outputs.version }}
          loaders: paper
          game-versions: 1.21.1, 1.21.2, 1.21.3, 1.21.4
          channel: release
          files: target/${{ needs.build.outputs.jar }}

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Snapshot — only on push to dev
  #   - Overwrites the rolling "snapshot" pre-release each time
  # ─────────────────────────────────────────────────────────────
  snapshot:
    name: Snapshot (dev)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: OverWatch-ML-${{ needs.build.outputs.version }}
          path: target/

      - name: Update rolling snapshot pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot
          name: "Dev Snapshot — ${{ needs.build.outputs.version }}-SNAPSHOT"
          body: |
            Automated build from the `dev` branch.

            **Commit:** `${{ github.sha }}`
            **Version:** `${{ needs.build.outputs.version }}-SNAPSHOT`

            > :warning: Not for production use.
          draft: false
          prerelease: true
          files: target/${{ needs.build.outputs.jar }}
